name: Refresh item data

# Daily snapshot of the current patch's item data (ddragon + meraki).
# `items fetch --force` writes nothing when upstream is unchanged, so this
# only commits when a new patch lands or meraki corrects the current one.

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: items-fetch

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current patch item data
        run: python3 lol.py items fetch --force
      - name: Commit snapshot if it changed
        # Pushes made with GITHUB_TOKEN don't trigger the Pages workflow,
        # which is fine — item data isn't part of the published site.
        run: |
          if [ -n "$(git status --porcelain data/items)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/items
            git commit -m "items: refresh snapshot for current patch"
            git push
          else
            echo "No changes."
          fi
