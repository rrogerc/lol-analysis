# Match systemd.user.services.lol-tft-refresh in dotfiles/nixos/configuration.nix.
# Exit 75 means an exhausted temporary fetch failure. Exit 1 (permanent error)
# and exit 2 (review required) remain failed until the next intentional start.
[Unit]
StartLimitIntervalSec=30min
StartLimitBurst=3

[Service]
TimeoutStartSec=4h
Restart=no
RestartForceExitStatus=
RestartForceExitStatus=75
RestartSec=5min
